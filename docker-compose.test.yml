# Test-only stack — fully isolated from the live `docker-compose.yml`.
#
# The integration test suite (tests/) contains destructive cleanup (e.g. it
# clears ALL memories and deletes test sessions). Running it against the live
# stack would wipe real user data, so this stack uses its own volumes,
# container names, and port (18080). The backend service also bind-mounts the
# repo tests/ directory so pytest can run inside the image.
#
# Usage:
#   docker compose -p ra-test -f docker-compose.test.yml up -d --build
#   docker compose -p ra-test -f docker-compose.test.yml exec backend \
#     python -m pytest tests/ -q
#   docker compose -p ra-test -f docker-compose.test.yml down -v   # teardown

services:
  # ── ChromaDB (vector database, internal only) ─────────────
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: ra-test-chromadb
    volumes:
      - ra_test_chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - ra-test-network
    restart: "no"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && IFS= read -r status_line <&3 && [[ \"$$status_line\" == *\"200 OK\"* ]] && exec 3>&-"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── FastAPI backend with a throwaway DB + mounted tests ──
  backend:
    build: ./backend
    image: ra-test-backend:latest
    container_name: ra-test-backend
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ra_test_app_data:/data
      - ./tests:/app/tests
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.2-3b-instruct:free}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-nvidia/llama-3.1-nemotron-70b-instruct}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - HUGGINGFACE_BASE_URL=${HUGGINGFACE_BASE_URL:-https://router.huggingface.co/v1}
      - HUGGINGFACE_MODEL=${HUGGINGFACE_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_BASE_URL=${GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-2.0-flash}
      - MODELSLAB_API_KEY=${MODELSLAB_API_KEY:-}
      - MODELSLAB_BASE_URL=${MODELSLAB_BASE_URL:-https://modelslab.com/api/v1}
      - MODELSLAB_MODEL=${MODELSLAB_MODEL:-meta-llama/Llama-3.3-70B-Instruct}
      - ENABLE_TERMINAL_TOOL=${ENABLE_TERMINAL_TOOL:-false}
    depends_on:
      chromadb:
        condition: service_started
    networks:
      - ra-test-network
    restart: "no"

networks:
  ra-test-network:
    driver: bridge

volumes:
  ra_test_app_data:
  ra_test_chroma_data:
