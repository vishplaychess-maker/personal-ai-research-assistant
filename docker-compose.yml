services:
  # ── ChromaDB (vector database, internal only) ─────────────
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: research-assistant-chromadb
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - research-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && IFS= read -r status_line <&3 && [[ \"$$status_line\" == *\"200 OK\"* ]] && exec 3>&-"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ─────────────────────────────────────
  backend:
    build: ./backend
    container_name: research-assistant-backend
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app_data:/data
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.2-3b-instruct:free}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      - ENABLE_TERMINAL_TOOL=${ENABLE_TERMINAL_TOOL:-false}
    depends_on:
      chromadb:
        condition: service_started
    networks:
      - research-network
    restart: unless-stopped

  # ── React frontend (Vite dev server) ────────────────────
  frontend:
    build: ./frontend
    container_name: research-assistant-frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - research-network
    restart: unless-stopped

networks:
  research-network:
    driver: bridge

volumes:
  app_data:
  chromadb_data:
