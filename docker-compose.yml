services:
  # ── ChromaDB (vector database, internal only) ─────────────
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: research-assistant-chromadb
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - research-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && IFS= read -r status_line <&3 && [[ \"$$status_line\" == *\"200 OK\"* ]] && exec 3>&-"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ─────────────────────────────────────
  backend:
    build: ./backend
    container_name: research-assistant-backend
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    volumes:
      - app_data:/data
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - LLM_PROVIDER=${LLM_PROVIDER:-glm}
      # The GLM Free Router runs on the host; inside the container the host's
      # 127.0.0.1 is reached via host.docker.internal (same pattern as Ollama).
      - GLM_BASE_URL=${GLM_BASE_URL:-http://host.docker.internal:8320/v1}
      - GLM_MODEL=${GLM_MODEL:-glm-5.3-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.2-3b-instruct:free}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-nvidia/llama-3.1-nemotron-70b-instruct}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - HUGGINGFACE_BASE_URL=${HUGGINGFACE_BASE_URL:-https://router.huggingface.co/v1}
      - HUGGINGFACE_MODEL=${HUGGINGFACE_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_BASE_URL=${GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-2.0-flash}
      - MODELSLAB_API_KEY=${MODELSLAB_API_KEY:-}
      - MODELSLAB_BASE_URL=${MODELSLAB_BASE_URL:-https://modelslab.com/api/v1}
      - MODELSLAB_MODEL=${MODELSLAB_MODEL:-meta-llama/Llama-3.3-70B-Instruct}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TOGETHER_BASE_URL=${TOGETHER_BASE_URL:-https://api.together.xyz/v1}
      - TOGETHER_MODEL=${TOGETHER_MODEL:-meta-llama/Llama-3.3-70B-Instruct-Turbo-Free}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_BASE_URL=${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - COHERE_BASE_URL=${COHERE_BASE_URL:-https://api.cohere.ai/v1}
      - COHERE_MODEL=${COHERE_MODEL:-command-r-plus}
      - ENABLE_DEEP_RESEARCH=${ENABLE_DEEP_RESEARCH:-true}
      - DEEP_RESEARCH_MAX_RESULTS=${DEEP_RESEARCH_MAX_RESULTS:-5}
      - DEEP_RESEARCH_MAX_SCRAPE=${DEEP_RESEARCH_MAX_SCRAPE:-3}
      - ENABLE_TERMINAL_TOOL=${ENABLE_TERMINAL_TOOL:-false}
      - ENABLE_MCP_TOOL=${ENABLE_MCP_TOOL:-false}
      - MCP_CALL_TIMEOUT_S=${MCP_CALL_TIMEOUT_S:-30}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      chromadb:
        condition: service_started
    networks:
      - research-network
    restart: unless-stopped

  # ── React frontend (Vite dev server) ────────────────────
  frontend:
    build: ./frontend
    container_name: research-assistant-frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped

networks:
  research-network:
    driver: bridge

volumes:
  app_data:
  chromadb_data: